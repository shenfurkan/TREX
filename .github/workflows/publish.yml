name: publish

# One run per release tag runs the CI test gate, builds once, uploads those exact files to
# PyPI after a required reviewer approves the `pypi` environment, verifies the public install,
# and finally creates the GitHub release for the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - run: uv sync --locked --python 3.14
      - run: uv run ruff check src tests
      - run: uv run pytest -q -m 'not slow and not network'

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.14
      - name: Bind the build to the release tag
        id: release
        run: |
          version=$(uv run --no-project --python 3.14 python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release_tag="v$version"
          if [ "$GITHUB_REF" != "refs/tags/$release_tag" ]; then
            echo "Run this workflow at tag $release_tag." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TREX $version, source commit $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check CITATION.cff version matches the package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cited=$(uv run --no-project --python 3.14 python -c 'import re; print(re.search(r"(?m)^version:\s*(\S+)", open("CITATION.cff").read()).group(1).strip(chr(34) + chr(39)))')
          if [ "$cited" != "$VERSION" ]; then
            echo "CITATION.cff version $cited does not match pyproject.toml version $VERSION" >&2
            exit 1
          fi
      - name: Build, check and install the release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$VERSION" = 1.0.0 ]; then
            # PyPI permanently reserves the deleted 1.0.0 wheel and sdist filenames,
            # so a build number changes the wheel name while the version stays 1.0.0.
            uv build --no-sources --python 3.14 --wheel --config-setting=--build-option=--build-number=2
            set -- dist/*
            if [ "$#" -ne 1 ] || [ "$1" != dist/trex-1.0.0-2-py3-none-any.whl ]; then
              echo "Expected only the numbered TREX 1.0.0 wheel in dist/." >&2
              exit 1
            fi
          else
            uv build --no-sources --python 3.14
            set -- dist/*.whl dist/*.tar.gz
          fi
          uvx twine check --strict dist/*
          for artifact in "$@"; do
            rm -rf /tmp/check && uv venv --python 3.14 /tmp/check
            uv pip install --python /tmp/check/bin/python "$artifact"
            /tmp/check/bin/python -c 'import os, importlib.metadata as m, trex.app; assert m.version("trex") == os.environ["VERSION"]'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  verify-pypi:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Run the documented public install and offline example
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          for requirement in trex "trex==$VERSION"; do
            uv venv --seed --python 3.14 "$requirement-venv"
            py="$PWD/$requirement-venv/bin/python"
            retry_until=$((SECONDS + 60))
            # A stale index can install an older version without reporting an error.
            until "$py" -m pip --isolated install --upgrade --no-cache-dir \
              --index-url https://pypi.org/simple/ "$requirement" \
              && "$py" -c 'import os, importlib.metadata as m; assert (actual := m.version("trex")) == os.environ["VERSION"], f"unexpected TREX version: {actual}"'; do
              if (( SECONDS + 10 > retry_until )); then
                exit 1
              fi
              echo "PyPI install or version check failed; retrying in 10 seconds."
              sleep 10
            done
            "$py" -m pip check
            "$py" -m trex.run --help
          done
          "$py" -m trex.example trex-demo
          test -s trex-demo/result/summary.json && test -s trex-demo/result/scenarios.csv

  github-release:
    needs: [build, verify-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Create the GitHub release for this tag once
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "TREX ${VERSION}" --generate-notes
