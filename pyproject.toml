[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "trex"
version = "1.0.0"
description = "Portable TESS conditional false-positive diagnostics; no planet-validation claims"
readme = "README.md"
authors = [{ name = "Furkan Şen" }]
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
  "exoplanet",
  "transit",
  "false positive",
  "statistical validation",
  "TESS",
  "TRICERATOPS",
]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
]
dependencies = [
  "numpy>=2.5.5",
  "scipy>=1.18.1",
  "pandas>=2.3.3",
  "matplotlib>=3.11.2",
  "astropy>=8.0.3",
  "astroquery>=0.4.11",
  "lightkurve>=2.6.0",
  "dynesty>=3.0.0",
  "jax>=0.11.2,<0.12",
  "jaxoplanet>=0.1.0",
  "equinox>=0.13.8",
  "blackjax>=1.7.1",
  "optax>=0.2.8",
  "gaiadr3-zeropoint>=0.1.0",
  # Imported directly by trex.acquisition (archive transport, TRILEGAL TLS, SHBoost UWS).
  "requests>=2.34.2",
  "urllib3>=2.8.0",
  "certifi>=2026.7.22",
  "cryptography>=50.0.1",
  "pyvo>=1.9.1",
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]>=0.11.2,<0.12"]

[project.urls]
Repository = "https://github.com/shenfurkan/TREX"
Documentation = "https://github.com/shenfurkan/TREX/tree/v1.0.0/docs"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-xdist==3.8.0", "ruff==0.16.9"]

[tool.setuptools]
include-package-data = false
packages = [
  "trex", "trex.foundation", "trex.runtime", "trex.stellar",
  "trex.models", "trex.evidence", "trex.accelerators", "trex.stellar_light",
  "trex.photometry", "trex.acquisition", "trex.populations", "trex.app",
]

[tool.setuptools.package-dir]
trex = "src"

[tool.setuptools.package-data]
trex = [
  "_data/*.csv", "_data/*LICENSE",
  "_data/responses/README.md",
  "_data/responses/roman/*.ecsv", "_data/responses/roman/*LICENSE",
  "_data/responses/plato/*.csv", "_data/responses/plato/*LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: numerical-engine or computationally intensive tests",
  "network: tests requiring live network access",
]
filterwarnings = ["ignore:.*the tpfmodel submodule is not available.*:UserWarning"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ISC", "LOG", "PLE", "DTZ", "A", "EXE", "INT", "PIE", "FURB", "RSE"]
ignore = ["B905"]
